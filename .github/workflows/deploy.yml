name: Deploy

# Deploys on every push to main or deploy/self-hosted (and on manual run). Needs these repository secrets:
#   VPS_HOST (hostname or IP), VPS_USER, VPS_SSH_KEY (private key, full PEM/OpenSSH text)
# Optional: VPS_PORT (default 22), VPS_KNOWN_HOSTS (output of `ssh-keyscan -H your.host`; pins the server key).
on:
  push:
    branches: [main, deploy/self-hosted]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] && [ -n "$HOST" ] || { echo "VPS_SSH_KEY and VPS_HOST secrets are required"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else ssh-keyscan -p "${PORT:-22}" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_@$HOST" 'bash -s' "$BRANCH" <<'REMOTE'
          set -euo pipefail
          # A fresh SSH session starts in $HOME, not in the project, so move into the repo first.
          BRANCH="$1"
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad branch name"; exit 1; }
          cd ~/aydexCloud
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git merge --ff-only "origin/$BRANCH" || { echo "server checkout has local changes or diverged:"; git status --short; exit 1; }
          git log --oneline -1
          docker compose build --pull web tracker
          docker compose up -d web tracker
          docker compose exec -T web npx prisma db push
          docker image prune -f >/dev/null
          # Wait for both services to answer.
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3001/health && curl -fsS -o /dev/null http://127.0.0.1:3000/ && { echo "healthy"; exit 0; }
            sleep 3
          done
          echo "services did not become healthy"; docker compose ps; exit 1
          REMOTE
