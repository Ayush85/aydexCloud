services:
  # Bundled Postgres. Only started with `--profile local-db` (or
  # COMPOSE_PROFILES=local-db). Skip it to use a Postgres on the host:
  # set DATABASE_URL to postgresql://USER:PASS@host.docker.internal:5432/DB
  postgres:
    profiles: ["local-db"]
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aydex
      POSTGRES_USER: aydex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aydex -d aydex"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - aydex

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - aydex

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - aydex

  tracker:
    build:
      context: ./tracker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CLICKHOUSE_ADDR: ${CLICKHOUSE_ADDR:-clickhouse:9000}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_TLS: ${CLICKHOUSE_TLS:-false}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      PORT: 3001
      GEOIP_DB_PATH: /data/GeoLite2-Country.mmdb
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./db/geoip:/data:ro
    ports:
      - "127.0.0.1:${TRACKER_PORT:-3001}:3001"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - aydex

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_TRACKER_URL: ${NEXT_PUBLIC_TRACKER_URL}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      NODE_ENV: production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_AGENCY: ${STRIPE_PRICE_AGENCY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CRON_SECRET: ${CRON_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      clickhouse:
        condition: service_healthy
    networks:
      - aydex

  # Optional: only started with `--profile caddy`. Skip it when the host
  # already runs nginx on 80/443 (see deploy/nginx/aydex.cloud.conf).
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TRACKER_DOMAIN: ${TRACKER_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - tracker
    networks:
      - aydex

  cron:
    image: alpine:3.19
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ./ops/crontab:/etc/crontabs/root:ro
    command: sh -c "apk add --no-cache curl >/dev/null && crond -f -l 2"
    depends_on:
      - web
    networks:
      - aydex

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  aydex:
    driver: bridge
