# Drop into /etc/nginx/sites-available/aydex.cloud, symlink to sites-enabled,
# then: nginx -t && systemctl reload nginx
# TLS: certbot --nginx -d aydex.cloud -d www.aydex.cloud -d t.aydex.cloud
# (certbot rewrites these blocks to add the 443 listeners and http->https redirect)

server {
    listen 80;
    server_name aydex.cloud www.aydex.cloud;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name t.aydex.cloud;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Tracker reads X-Real-IP first for visitor IP / GeoIP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
